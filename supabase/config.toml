project_id = "zybdotagjwektucfdkri"

[functions.notify-version-update]
# CA-29: true. The function now takes the creator from the caller's token and
# checks that the caller owns the item, so the gateway rejects a call with no
# key before it runs.
verify_jwt = true

[functions.check-compatibility-status]
# Deliberately false: a scheduled job calls it with no user token. CA-29: the
# function itself answers 401 unless the x-cron-secret header matches the
# CRON_SECRET secret, and with no CRON_SECRET set nobody can run it.
verify_jwt = false

[functions.create-split-checkout-session]
# CA-29: true. The gateway rejects a call with no key; the price and splits come
# from the database and the return addresses must be on this site.
verify_jwt = true

[functions.create-pwyw-checkout-session]
# CA-29: true. The gateway rejects a call with no key; the amount is bounded by
# the item's floor and 1,000 pounds and the return addresses must be on this site.
verify_jwt = true

[functions.import-github-readme]
# CA-29: true. The gateway rejects a call with no key; the function fetches only
# api.github.com.
verify_jwt = true

[functions.public-api]
# Deliberately false: a public read for anyone, with the public key.
verify_jwt = false

[functions.post-json]
# Deliberately false: a public read for anyone. CA-29: it reads with the public
# key, so the database's own rules decide which rows come back.
verify_jwt = false

[functions.sitemap-xml]
# Deliberately false: a public read for crawlers. CA-29: it reads with the public
# key, so the database's own rules decide which rows come back.
verify_jwt = false

[functions.generate-ai-pdf]
# CA-29: true. The gateway rejects a call with no key; the function makes a PDF
# only of a public approved post, or of the caller's own.
verify_jwt = true

[functions.generate-build-layers]
# Deliberately true, for the same reason as the three parsers below: NS-P22
# writes explanation layers for a build the caller must own, so the gateway
# must reject an unauthenticated call before the function runs.
verify_jwt = true

[functions.parse-repo]
# Deliberately true, for the same reason as the two parsers below: NS-P21
# proposes a draft against a build the caller must own, so the gateway must
# reject an unauthenticated call before the function runs.
verify_jwt = true

[functions.parse-lovable]
# Deliberately true, for the same reason as parse-transcript below: NS-P20
# proposes a draft against a build the caller must own, so the gateway must
# reject an unauthenticated call before the function runs.
verify_jwt = true

[functions.parse-transcript]
# Deliberately true. NS-P13 proposes a draft against a build the caller must own,
# so the gateway must reject an unauthenticated call before the function runs.
verify_jwt = true

[functions.mcp]
# Deliberately false, and the only function in this repo that should be.
#
# The gateway must NOT reject an unauthenticated request here, for two reasons.
# First, the OAuth discovery endpoint this function serves — GET
# .../mcp/.well-known/oauth-protected-resource — has to be reachable without a
# token, because it is how a client learns where to get one. Second, the
# @supabase/server middleware does the verification itself, and does it better
# than the gateway can: it returns a 401 carrying the WWW-Authenticate header
# that sends the client to that endpoint, which is what makes the connector
# discoverable rather than merely closed.
#
# This is NOT the pattern the seed functions set. Those are verify_jwt = false
# and genuinely open, which is a known defect. This one is gated in code, by
# withSupabase({ auth: 'user' }) in index.ts, on every request that is not
# discovery. Removing that middleware opens the door; removing this line only
# breaks discovery.
verify_jwt = false
