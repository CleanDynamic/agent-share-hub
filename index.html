<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OpenBuilds.ai: things people built with AI, and whether they still work</title>
    <meta name="description" content="A gallery of AI builds with the proof attached: who ran them, whether they worked, and when.">
    <meta name="author" content="openbuilds.ai" />

    <!-- Typefaces: Geist (UI and display) and Geist Mono (data), self-hosted as variable .woff2 files in /public/fonts
         and declared by the @font-face rules in src/index.css. Geist is preloaded so the first heading does not wait
         on the stylesheet. UI-P99 retired Figtree, Sentient and DM Mono, and with them the request to Google Fonts.
         The faces are read through src/lib/theme/type.ts. -->
    <!-- SV-03: the first database request would pay for DNS and TLS; this pays for them while the bundle loads. The address is the client's own, filled in by Vite at build time. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <meta name="build-commit" content="%VITE_BUILD_COMMIT%" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Geist-Variable.woff2" crossorigin />

    <!-- BG-P02 theme boot: sets <html data-theme> before the bundle, so nobody
         sees a flash of the other room. Mirrors src/contexts/ThemeContext.tsx —
         same bg-theme key, same Noon fallback, and the same migration of the
         name Noon had before UI-P02. Change one, change both. -->
    <script>try{var t=localStorage.getItem("bg-theme");if(t=="exhibition")localStorage.setItem("bg-theme",t="noon");if(t=="system")t=matchMedia("(prefers-color-scheme:dark)").matches?"dusk":"noon";document.documentElement.dataset.theme=t=="dusk"?"dusk":"noon"}catch(e){document.documentElement.dataset.theme="noon"}</script>

    
    
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenBuilds.ai" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:title" content="OpenBuilds.ai: things people built with AI, and whether they still work">
  <meta name="twitter:title" content="OpenBuilds.ai: things people built with AI, and whether they still work">
  <meta property="og:description" content="A gallery of AI builds with the proof attached: who ran them, whether they worked, and when.">
  <meta name="twitter:description" content="A gallery of AI builds with the proof attached: who ran them, whether they worked, and when.">
  <meta property="og:image" content="https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev/b72c367b-87e9-4dfb-9194-e5eaa9ff70f1/id-preview-dcdc4a32--6ef15597-ce5e-4a28-b61c-f6583cb5d718.lovable.app-1773702901029.png">
  <meta name="twitter:image" content="https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev/b72c367b-87e9-4dfb-9194-e5eaa9ff70f1/id-preview-dcdc4a32--6ef15597-ce5e-4a28-b61c-f6583cb5d718.lovable.app-1773702901029.png">
</head>

  <body>
    <div id="root">
      <!-- UX-01 P4: something paints before the scripts run. A static copy of what SiteFrame variant="site" draws on a desktop:
           the frame, the header row (48) and the empty surface (width calc(100% - 12px), max 1428, margin 0 auto 6px, radius 10,
           1px border, background and shadow), reading the same custom properties the theme boot script selects. No page-specific
           skeleton. React replaces it when it mounts, with no fade: the only first-load fade is PageArrival's.
           It is for the pages that draw that frame at 768px and up (the list in the script is the site routes in App.tsx inside
           Layout, minus the composer, which draws a wide surface). The style below hides it under 768px with no script
           (useIsPhone's breakpoint); the script after it removes it on any other path or width before first paint.
           Change SiteFrame's SURFACE, HEADER_HEIGHT or that breakpoint, change this. -->
      <style>@media (max-width:767px){#boot-shell{display:none!important}}</style>
      <div id="boot-shell" aria-hidden="true" style="position:relative;min-height:100dvh;display:flex;flex-direction:column;background:var(--frame)">
        <div style="min-height:48px;background:var(--frame)"></div>
        <div style="flex-grow:1;box-sizing:border-box;width:calc(100% - 12px);max-width:1428px;margin:0 auto 6px;background:var(--surface);border:1px solid var(--surface-border);border-radius:10px;box-shadow:var(--surface-shadow)"></div>
      </div>
      <script>(function(){var p=location.pathname,ok=p=="/"||/^\/(builds|openbuilds|library|drafts|b|about|api-docs|profile|notifications|gallery|bounties)(\/|$)/.test(p);if(!ok||!matchMedia("(min-width:768px)").matches){var s=document.getElementById("boot-shell");if(s)s.remove()}})()</script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
