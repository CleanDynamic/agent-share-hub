    <!-- Typefaces: Geist (UI and display) and Geist Mono (data), self-hosted as variable .woff2 files in /public/fonts
         and declared by the @font-face rules in src/index.css. Geist is preloaded so the first heading does not wait
         on the stylesheet. UI-P99 retired Figtree, Sentient and DM Mono, and with them the request to Google Fonts.
         The faces are read through src/lib/theme/type.ts. -->
    <!-- SV-03: the first database request would pay for DNS and TLS; this pays for them while the bundle loads. The address is the client's own, filled in by Vite at build time. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Geist-Variable.woff2" crossorigin />

    <!-- BG-P02 theme boot: sets <html data-theme> before the bundle, so nobody
         sees a flash of the other room. Mirrors src/contexts/ThemeContext.tsx —
         same bg-theme key, same Noon fallback, and the same migration of the
         name Noon had before UI-P02. Change one, change both. -->
    <script>try{var t=localStorage.getItem("bg-theme");if(t=="exhibition")localStorage.setItem("bg-theme",t="noon");if(t=="system")t=matchMedia("(prefers-color-scheme:dark)").matches?"dusk":"noon";document.documentElement.dataset.theme=t=="dusk"?"dusk":"noon"}catch(e){document.documentElement.dataset.theme="noon"}</script>
